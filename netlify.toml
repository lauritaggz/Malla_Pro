[build]
  command = "npm run build"
  publish = "dist"

# Preview social apuntando al dominio de Netlify
[build.environment]
  VITE_SITE_URL = "https://malla-pro.netlify.app"
  NODE_VERSION = "22"

# SPA: archivos reales (og-image.jpg, favicon, /mallas/*) se sirven primero
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
